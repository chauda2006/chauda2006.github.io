<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="coreBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090b" />
      <stop offset="100%" stop-color="#11161d" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#coreBg)" rx="16" />

  <!-- Blueprint Lines -->
  <g opacity="0.12" stroke="#38ff91" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/><line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/><line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="500"/><line x1="320" y1="0" x2="320" y2="500"/>
    <line x1="480" y1="0" x2="480" y2="500"/><line x1="640" y1="0" x2="640" y2="500"/>
  </g>

  <!-- Central Gear Core Blueprint -->
  <g transform="translate(400, 250)">
    <circle cx="0" cy="0" r="160" fill="none" stroke="#222d3d" stroke-width="1" stroke-dasharray="4 8"/>
    <circle cx="0" cy="0" r="140" fill="none" stroke="#ff244f" stroke-width="2" stroke-dasharray="14 6" opacity="0.8"/>
    <circle cx="0" cy="0" r="110" fill="none" stroke="#38ff91" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.9"/>
    <circle cx="0" cy="0" r="80" fill="#0c1017" stroke="#ff244f" stroke-width="2"/>
    <circle cx="0" cy="0" r="50" fill="#141a24" stroke="#38ff91" stroke-width="2"/>
    <circle cx="0" cy="0" r="20" fill="#ff244f" />

    <!-- Gear Teeth Outer -->
    <path d="M -15 -140 L 15 -140 L 10 -155 L -10 -155 Z" fill="#ff244f"/>
    <path d="M -15 140 L 15 140 L 10 155 L -10 155 Z" fill="#ff244f"/>
    <path d="M -140 -15 L -140 15 L -155 10 L -155 -10 Z" fill="#ff244f"/>
    <path d="M 140 -15 L 140 15 L 155 10 L 155 -10 Z" fill="#ff244f"/>
    
    <path d="M -100 -100 L -80 -120 L -90 -130 L -110 -110 Z" fill="#38ff91"/>
    <path d="M 100 100 L 80 120 L 90 130 L 110 110 Z" fill="#38ff91"/>
    <path d="M -100 100 L -80 80 L -90 70 L -110 90 Z" fill="#38ff91"/>
    <path d="M 100 -100 L 80 -80 L 90 -70 L 110 -90 Z" fill="#38ff91"/>

    <!-- Crosshair axes -->
    <line x1="-180" y1="0" x2="180" y2="0" stroke="#38ff91" stroke-width="0.8" stroke-dasharray="4 4" opacity="0.6"/>
    <line x1="0" y1="-180" x2="0" y2="180" stroke="#ff244f" stroke-width="0.8" stroke-dasharray="4 4" opacity="0.6"/>
  </g>

  <!-- Technical Labels -->
  <text x="60" y="80" fill="#38ff91" font-family="'Courier New', monospace" font-size="14" font-weight="bold">NEON ART UNIVERSE // ARCHITECTURE</text>
  <text x="60" y="105" fill="#a3abb5" font-family="'Courier New', monospace" font-size="11">STANDALONE VANILLA CORE • NO HEAVY RUNTIMES • 100% LIGHTHOUSE</text>

  <rect x="60" y="380" width="220" height="60" rx="6" fill="#11161f" stroke="#ff244f" stroke-width="1"/>
  <text x="75" y="405" fill="#ff244f" font-family="'Courier New', monospace" font-size="10">PALETTE ENGINE</text>
  <text x="75" y="425" fill="#f4f6f8" font-family="'Segoe UI', sans-serif" font-size="11">Crimson #FF244F × Emerald #38FF91</text>

  <rect x="520" y="380" width="220" height="60" rx="6" fill="#11161f" stroke="#38ff91" stroke-width="1"/>
  <text x="535" y="405" fill="#38ff91" font-family="'Courier New', monospace" font-size="10">KINETIC ENGINE</text>
  <text x="535" y="425" fill="#f4f6f8" font-family="'Segoe UI', sans-serif" font-size="11">IntersectionObserver + CSS Transform</text>
</svg>
