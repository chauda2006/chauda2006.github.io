<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="artBg4" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e141d"/>
      <stop offset="70%" stop-color="#080c12"/>
      <stop offset="100%" stop-color="#040609"/>
    </radialGradient>
  </defs>

  <rect width="600" height="600" fill="url(#artBg4)"/>

  <!-- Isometric Blueprint Grid -->
  <g opacity="0.15" stroke="#38ff91" stroke-width="0.8">
    <path d="M 0 300 L 300 120 L 600 300 L 300 480 Z"/>
    <path d="M 0 200 L 300 20 L 600 200 L 300 380 Z"/>
    <path d="M 0 400 L 300 220 L 600 400 L 300 580 Z"/>
  </g>

  <!-- Isometric Towers / Cubes -->
  <!-- Center Tower -->
  <g transform="translate(300, 240)">
    <!-- Top Face -->
    <polygon points="0,-40 60,-5 0,30 -60,-5" fill="#152130" stroke="#38ff91" stroke-width="2"/>
    <!-- Left Face -->
    <polygon points="-60,-5 0,30 0,110 -60,75" fill="#0c121c" stroke="#38ff91" stroke-width="1.5"/>
    <!-- Right Face -->
    <polygon points="0,30 60,-5 60,75 0,110" fill="#090e17" stroke="#ff244f" stroke-width="2"/>
    
    <!-- Central Antenna -->
    <line x1="0" y1="-40" x2="0" y2="-90" stroke="#ff244f" stroke-width="2"/>
    <circle cx="0" cy="-90" r="5" fill="#ff244f"/>
  </g>

  <!-- Left Tower -->
  <g transform="translate(190, 310)">
    <polygon points="0,-30 45,-5 0,20 -45,-5" fill="#131b26" stroke="#38ff91" stroke-width="1.5"/>
    <polygon points="-45,-5 0,20 0,70 -45,45" fill="#090d14" stroke="#38ff91" stroke-width="1"/>
    <polygon points="0,20 45,-5 45,45 0,70" fill="#070a10" stroke="#38ff91" stroke-width="1"/>
  </g>

  <!-- Right Tower -->
  <g transform="translate(410, 310)">
    <polygon points="0,-35 50,-5 0,25 -50,-5" fill="#131b26" stroke="#ff244f" stroke-width="1.5"/>
    <polygon points="-50,-5 0,25 0,80 -50,50" fill="#090d14" stroke="#ff244f" stroke-width="1"/>
    <polygon points="0,25 50,-5 50,50 0,80" fill="#070a10" stroke="#ff244f" stroke-width="1"/>
  </g>

  <!-- Interconnecting bridges -->
  <line x1="190" y1="310" x2="300" y2="270" stroke="#38ff91" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="300" y1="270" x2="410" y2="310" stroke="#ff244f" stroke-width="2" stroke-dasharray="6 4"/>

  <text x="30" y="560" fill="#38ff91" font-family="'Courier New', monospace" font-size="12" letter-spacing="2">ARTWORK № 04 // OBSIDIAN LABYRINTH</text>
  <text x="30" y="580" fill="#a3abb5" font-family="'Courier New', monospace" font-size="10">ISOMETRIC SCHEMATIC • COMPUTATIONAL ARCHITECTURE</text>
</svg>
