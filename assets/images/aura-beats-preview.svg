    <rect x="505" y="240" width="8" height="70" rx="3" fill="#38ff91"/>
    <rect x="520" y="225" width="8" height="85" rx="3" fill="#ff244f"/>
    <rect x="535" y="250" width="8" height="60" rx="3" fill="#38ff91"/>
