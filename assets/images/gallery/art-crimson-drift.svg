<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="artBg2" cx="60%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1f1016"/>
      <stop offset="50%" stop-color="#0e070a"/>
      <stop offset="100%" stop-color="#040608"/>
    </radialGradient>
    <linearGradient id="driftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff244f"/>
      <stop offset="100%" stop-color="#38ff91"/>
    </linearGradient>
  </defs>

  <rect width="600" height="600" fill="url(#artBg2)"/>

  <!-- Perspective Horizon Grid -->
  <g stroke="#8c1735" stroke-width="1" opacity="0.4">
    <line x1="0" y1="350" x2="600" y2="350"/>
    <line x1="0" y1="375" x2="600" y2="375"/>
    <line x1="0" y1="410" x2="600" y2="410"/>
    <line x1="0" y1="460" x2="600" y2="460"/>
    <line x1="0" y1="530" x2="600" y2="530"/>
    
    <!-- Vanishing perspective lines -->
    <line x1="300" y1="350" x2="0" y2="600"/>
    <line x1="300" y1="350" x2="100" y2="600"/>
    <line x1="300" y1="350" x2="200" y2="600"/>
    <line x1="300" y1="350" x2="300" y2="600"/>
    <line x1="300" y1="350" x2="400" y2="600"/>
    <line x1="300" y1="350" x2="500" y2="600"/>
    <line x1="300" y1="350" x2="600" y2="600"/>
  </g>

  <!-- Cyber Sun / Core -->
  <circle cx="300" cy="300" r="100" fill="none" stroke="#ff244f" stroke-width="2"/>
  <circle cx="300" cy="300" r="70" fill="#ff244f" opacity="0.1"/>
  <!-- Segmented cutouts in sun -->
  <line x1="200" y1="280" x2="400" y2="280" stroke="#040608" stroke-width="4"/>
  <line x1="200" y1="305" x2="400" y2="305" stroke="#040608" stroke-width="6"/>
  <line x1="200" y1="335" x2="400" y2="335" stroke="#040608" stroke-width="8"/>

  <!-- Energy trails -->
  <path d="M 50 200 Q 200 150 350 240 T 550 180" fill="none" stroke="#ff244f" stroke-width="3"/>
  <path d="M 80 230 Q 220 180 370 270 T 570 210" fill="none" stroke="#38ff91" stroke-width="2"/>
  <path d="M 20 260 Q 180 220 320 300 T 520 240" fill="none" stroke="#8c1735" stroke-width="2"/>

  <!-- Vehicle / Flying Contour -->
  <polygon points="300,310 260,345 340,345" fill="#0d1117" stroke="#38ff91" stroke-width="1.8"/>
  <line x1="240" y1="345" x2="220" y2="360" stroke="#ff244f" stroke-width="2"/>
  <line x1="360" y1="345" x2="380" y2="360" stroke="#ff244f" stroke-width="2"/>

  <text x="30" y="560" fill="#ff244f" font-family="'Courier New', monospace" font-size="12" letter-spacing="2">ARTWORK № 02 // NEON CRIMSON DRIFTER</text>
  <text x="30" y="580" fill="#a3abb5" font-family="'Courier New', monospace" font-size="10">SYNTHWAVE CONCEPT • RETRO-FUTURISTIC VECTOR</text>
</svg>
