  <circle cx="360" cy="220" r="80" fill="#0d1117" stroke="#8c1735" stroke-width="1" stroke-dasharray="6 4"/>
  <circle cx="360" cy="220" r="60" fill="#11161d" stroke="#38ff91" stroke-width="1" stroke-dasharray="3 5"/>
  <circle cx="360" cy="220" r="30" fill="url(#crimsonGradient)" />
  <circle cx="360" cy="220" r="8" fill="#f4f6f8" />
  <!-- Stylized Sound Waves -->
