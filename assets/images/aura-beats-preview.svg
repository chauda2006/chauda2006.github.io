  <!-- Player Bottom Bar -->
  <rect x="40" y="380" width="720" height="80" rx="0 0 12 12" fill="#11161f" stroke="#222d3d" stroke-width="1"/>
  <!-- Track Info -->
  <text x="70" y="415" fill="#f4f6f8" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="13">Aura Synth [VIP Session]</text>
  <text x="70" y="435" fill="#a3abb5" font-family="'Segoe UI', sans-serif" font-size="11">Châu Tiến Đạt × Cyber Studio • Lossless FLAC 24-bit</text>
  <!-- Controls -->
  <circle cx="430" cy="420" r="18" fill="#ff244f" />
  <polygon points="426,412 438,420 426,428" fill="#ffffff"/>
  <circle cx="390" cy="420" r="14" fill="#1b2430" stroke="#a3abb5" stroke-width="1"/>
  <polygon points="393,415 385,420 393,425" fill="#a3abb5"/>
  <circle cx="470" cy="420" r="14" fill="#1b2430" stroke="#a3abb5" stroke-width="1"/>
