<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d12" />
      <stop offset="50%" stop-color="#11161d" />
      <stop offset="100%" stop-color="#07090b" />
    </linearGradient>
    <linearGradient id="crimsonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff244f" />
      <stop offset="100%" stop-color="#8c1735" />
    </linearGradient>
    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38ff91" />
      <stop offset="100%" stop-color="#087a4a" />
    </linearGradient>
    <filter id="neonFilterRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="neonFilterGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGrad)" rx="24"/>
  
  <!-- Circuit Grid Grid lines -->
  <g opacity="0.15" stroke="#38ff91" stroke-width="0.75">
    <line x1="40" y1="0" x2="40" y2="400" />
    <line x1="80" y1="0" x2="80" y2="400" />
    <line x1="120" y1="0" x2="120" y2="400" />
    <line x1="160" y1="0" x2="160" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="240" y1="0" x2="240" y2="400" />
    <line x1="280" y1="0" x2="280" y2="400" />
    <line x1="320" y1="0" x2="320" y2="400" />
    <line x1="360" y1="0" x2="360" y2="400" />
    <line x1="0" y1="40" x2="400" y2="40" />
    <line x1="0" y1="80" x2="400" y2="80" />
    <line x1="0" y1="120" x2="400" y2="120" />
    <line x1="0" y1="160" x2="400" y2="160" />
    <line x1="0" y1="200" x2="400" y2="200" />
    <line x1="0" y1="240" x2="400" y2="240" />
    <line x1="0" y1="280" x2="400" y2="280" />
    <line x1="0" y1="320" x2="400" y2="320" />
    <line x1="0" y1="360" x2="400" y2="360" />
  </g>

  <!-- Outer HUD Ring -->
  <circle cx="200" cy="200" r="160" fill="none" stroke="#ff244f" stroke-width="1.5" stroke-dasharray="12 8" opacity="0.6" filter="url(#neonFilterRed)"/>
  <circle cx="200" cy="200" r="148" fill="none" stroke="#38ff91" stroke-width="1" stroke-dasharray="4 6" opacity="0.5"/>
  <circle cx="200" cy="200" r="135" fill="#0d1117" stroke="#38ff91" stroke-width="1.5" opacity="0.9" />

  <!-- Geometric Gear Teeth Behind Head -->
  <g opacity="0.3" stroke="#ff244f" stroke-width="2" fill="none">
    <path d="M 190 70 L 210 70 L 215 85 L 185 85 Z" />
    <path d="M 315 190 L 315 210 L 300 215 L 300 185 Z" />
    <path d="M 210 330 L 190 330 L 185 315 L 215 315 Z" />
    <path d="M 85 210 L 85 190 L 100 185 L 100 215 Z" />
    <path d="M 275 115 L 290 130 L 278 142 L 263 127 Z" />
    <path d="M 125 285 L 110 270 L 122 258 L 137 273 Z" />
    <path d="M 285 275 L 270 290 L 258 278 L 273 263 Z" />
    <path d="M 115 125 L 130 110 L 142 122 L 127 137 Z" />
  </g>

  <!-- Silhouette / Cyber Portrait Elements -->
  <!-- Shoulders -->
  <path d="M 120 310 C 130 260 170 245 200 245 C 230 245 270 260 280 310 Z" fill="#161d26" stroke="#38ff91" stroke-width="1.5"/>
  <!-- Cyber collar traces -->
  <path d="M 170 250 L 185 295 L 200 310 L 215 295 L 230 250" fill="none" stroke="#ff244f" stroke-width="1.8" filter="url(#neonFilterRed)"/>
  
  <!-- Head & Neck -->
  <path d="M 185 220 L 185 250 L 215 250 L 215 220 Z" fill="#1b222c" />
  <path d="M 160 160 C 160 110 240 110 240 160 C 240 195 215 225 200 225 C 185 225 160 195 160 160 Z" fill="#1f2835" stroke="#38ff91" stroke-width="1.5"/>

  <!-- Cybernetic Visor / Eye Imprint -->
  <path d="M 168 150 L 232 150 L 226 168 L 174 168 Z" fill="#07090b" stroke="#ff244f" stroke-width="2" filter="url(#neonFilterRed)"/>
  <line x1="175" y1="159" x2="225" y2="159" stroke="#ff244f" stroke-width="2" filter="url(#neonFilterRed)"/>
  <circle cx="210" cy="159" r="3" fill="#38ff91" filter="url(#neonFilterGreen)"/>
  
  <!-- Cyber Temple Circuit Marks -->
  <polyline points="152,140 164,140 170,146" fill="none" stroke="#38ff91" stroke-width="1.5"/>
  <circle cx="152" cy="140" r="2" fill="#38ff91"/>
  <polyline points="248,140 236,140 230,146" fill="none" stroke="#38ff91" stroke-width="1.5"/>
  <circle cx="248" cy="140" r="2" fill="#38ff91"/>

  <!-- Minimal Hair Contour -->
  <path d="M 158 150 C 155 120 180 100 200 100 C 228 100 245 120 242 150 C 235 125 210 115 195 115 C 175 115 162 130 158 150 Z" fill="#ff244f" opacity="0.8"/>

  <!-- HUD Overlay Details -->
  <text x="200" y="360" font-family="'Be Vietnam Pro', 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="12" fill="#38ff91" letter-spacing="2" text-anchor="middle" font-weight="700">CHÂU TIẾN ĐẠT // DEV</text>
  <text x="200" y="378" font-family="'Fira Code', 'Courier New', monospace" font-size="8" fill="#a3abb5" letter-spacing="2" text-anchor="middle">CORE NODE ID: #2006-IT</text>

  <!-- Corner Brackets -->
  <path d="M 20 50 L 20 20 L 50 20" fill="none" stroke="#ff244f" stroke-width="2" />
  <path d="M 380 50 L 380 20 L 350 20" fill="none" stroke="#38ff91" stroke-width="2" />
  <path d="M 20 350 L 20 380 L 50 380" fill="none" stroke="#38ff91" stroke-width="2" />
  <path d="M 380 350 L 380 380 L 350 380" fill="none" stroke="#ff244f" stroke-width="2" />
</svg>
