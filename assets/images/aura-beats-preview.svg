  <path d="M 480 180 Q 530 220 580 160 T 660 210 T 720 180" fill="none" stroke="#38ff91" stroke-width="2.5" />
  <path d="M 480 210 Q 510 170 570 230 T 650 170 T 720 220" fill="none" stroke="#087a4a" stroke-width="1.5" />

