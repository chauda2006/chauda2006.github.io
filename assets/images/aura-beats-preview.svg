  <circle cx="65" cy="62" r="5" fill="#ff244f" />
  <circle cx="85" cy="62" r="5" fill="#ffb830" opacity="0.6"/>
  <circle cx="105" cy="62" r="5" fill="#38ff91" />
  <text x="135" y="66" fill="#a3abb5" font-family="'Courier New', monospace" font-size="12">aura-beats://player-v2.4 [STREAMING CORE]</text>
  <rect x="660" y="52" width="80" height="20" rx="4" fill="#1b2430" stroke="#38ff91" stroke-width="1"/>
  <text x="700" y="65" fill="#38ff91" font-family="'Courier New', monospace" font-size="10" text-anchor="middle">VIP ACTIVE</text>

  <!-- Left Sidebar / Playlist -->
  <rect x="40" y="84" width="200" height="376" fill="#0b0e14" />
  <line x1="240" y1="84" x2="240" y2="460" stroke="#222d3d" stroke-width="1.5" />
  <text x="65" y="120" fill="#38ff91" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="12" letter-spacing="1">AUDIO ENGINE</text>
  <rect x="55" y="140" width="170" height="32" rx="6" fill="#161f2b" stroke="#38ff91" stroke-width="1"/>
  <text x="75" y="160" fill="#f4f6f8" font-family="'Segoe UI', sans-serif" font-size="11">► Cyber Synthwave</text>
  <rect x="55" y="180" width="170" height="32" rx="6" fill="transparent" />
  <text x="75" y="200" fill="#a3abb5" font-family="'Segoe UI', sans-serif" font-size="11">♪ Obsidian Bassline</text>
  <rect x="55" y="220" width="170" height="32" rx="6" fill="transparent" />
  <text x="75" y="240" fill="#a3abb5" font-family="'Segoe UI', sans-serif" font-size="11">♪ Crimson Pulse Ep.01</text>
  <rect x="55" y="260" width="170" height="32" rx="6" fill="transparent" />
  <text x="75" y="280" fill="#a3abb5" font-family="'Segoe UI', sans-serif" font-size="11">♪ Emerald Glitch Core</text>

