    <rect x="565" y="235" width="8" height="75" rx="3" fill="#38ff91"/>
    <rect x="580" y="270" width="8" height="40" rx="3" fill="#087a4a"/>
    <rect x="595" y="220" width="8" height="90" rx="3" fill="#ff244f"/>
    <rect x="610" y="245" width="8" height="65" rx="3" fill="#38ff91"/>
    <rect x="625" y="265" width="8" height="45" rx="3" fill="#38ff91"/>
    <rect x="640" y="230" width="8" height="80" rx="3" fill="#ff244f"/>
    <rect x="655" y="275" width="8" height="35" rx="3" fill="#087a4a"/>
    <rect x="670" y="255" width="8" height="55" rx="3" fill="#38ff91"/>
    <rect x="685" y="240" width="8" height="70" rx="3" fill="#38ff91"/>
    <rect x="700" y="268" width="8" height="42" rx="3" fill="#ff244f"/>
