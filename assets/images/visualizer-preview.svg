<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="visBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b0f" />
      <stop offset="100%" stop-color="#10151f" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#visBg)" rx="16" />

  <!-- App Window -->
  <rect x="40" y="40" width="720" height="420" rx="12" fill="#0b0e14" stroke="#1f2937" stroke-width="2" />
  <rect x="40" y="40" width="720" height="44" rx="12 12 0 0" fill="#141a24" />
  <circle cx="65" cy="62" r="5" fill="#ff244f" />
  <circle cx="85" cy="62" r="5" fill="#ffb830" opacity="0.6"/>
  <circle cx="105" cy="62" r="5" fill="#38ff91" />
  <text x="135" y="66" fill="#a3abb5" font-family="'Courier New', monospace" font-size="12">cyber-matrix://algo-visualizer.js [O(N log N)]</text>
  <rect x="635" y="52" width="105" height="20" rx="4" fill="#1e293b" stroke="#ff244f" stroke-width="1"/>
  <text x="687" y="65" fill="#ff244f" font-family="'Courier New', monospace" font-size="10" text-anchor="middle">QUICKSORT RUNNING</text>

  <!-- Left: Array Bar Visualizer -->
  <g transform="translate(60, 110)">
    <rect x="0" y="0" width="380" height="240" rx="8" fill="#121822" stroke="#222d3d" stroke-width="1"/>
    <text x="15" y="25" fill="#38ff91" font-family="'Courier New', monospace" font-size="11">ARRAY STATE [n=24]</text>

    <!-- Bars with dynamic heights -->
    <g transform="translate(20, 210) scale(1, -1)">
      <rect x="0" y="0" width="10" height="25" fill="#38ff91" rx="2"/>
      <rect x="14" y="0" width="10" height="45" fill="#38ff91" rx="2"/>
      <rect x="28" y="0" width="10" height="60" fill="#38ff91" rx="2"/>
      <rect x="42" y="0" width="10" height="75" fill="#38ff91" rx="2"/>
      <rect x="56" y="0" width="10" height="90" fill="#38ff91" rx="2"/>
      <rect x="70" y="0" width="10" height="110" fill="#38ff91" rx="2"/>
      <rect x="84" y="0" width="10" height="135" fill="#ff244f" rx="2"/>
      <rect x="98" y="0" width="10" height="85" fill="#38ff91" rx="2"/>
      <rect x="112" y="0" width="10" height="155" fill="#38ff91" rx="2"/>
      <rect x="126" y="0" width="10" height="40" fill="#ff244f" rx="2"/>
      <rect x="140" y="0" width="10" height="120" fill="#38ff91" rx="2"/>
      <rect x="154" y="0" width="10" height="170" fill="#ff244f" rx="2"/>
      <rect x="168" y="0" width="10" height="65" fill="#38ff91" rx="2"/>
      <rect x="182" y="0" width="10" height="95" fill="#38ff91" rx="2"/>
      <rect x="196" y="0" width="10" height="140" fill="#38ff91" rx="2"/>
      <rect x="210" y="0" width="10" height="50" fill="#38ff91" rx="2"/>
      <rect x="224" y="0" width="10" height="80" fill="#38ff91" rx="2"/>
      <rect x="238" y="0" width="10" height="130" fill="#38ff91" rx="2"/>
      <rect x="252" y="0" width="10" height="160" fill="#ff244f" rx="2"/>
      <rect x="266" y="0" width="10" height="105" fill="#38ff91" rx="2"/>
      <rect x="280" y="0" width="10" height="70" fill="#38ff91" rx="2"/>
      <rect x="294" y="0" width="10" height="115" fill="#38ff91" rx="2"/>
      <rect x="308" y="0" width="10" height="145" fill="#38ff91" rx="2"/>
      <rect x="322" y="0" width="10" height="180" fill="#38ff91" rx="2"/>
    </g>

    <text x="15" y="225" fill="#a3abb5" font-family="'Courier New', monospace" font-size="10">PIVOT: index[11] | SWAPS: 142 | COMPARISONS: 389</text>
  </g>

  <!-- Right: Graph Nodes & Pathfinding Simulation -->
  <g transform="translate(460, 110)">
    <rect x="0" y="0" width="280" height="240" rx="8" fill="#121822" stroke="#222d3d" stroke-width="1"/>
    <text x="15" y="25" fill="#ff244f" font-family="'Courier New', monospace" font-size="11">DIJKSTRA SHORTEST PATH</text>
    
    <!-- Graph Edges -->
    <line x1="50" y1="80" x2="140" y2="60" stroke="#38ff91" stroke-width="2" />
    <line x1="50" y1="80" x2="80" y2="160" stroke="#ff244f" stroke-width="2.5" />
    <line x1="140" y1="60" x2="220" y2="90" stroke="#38ff91" stroke-width="1" stroke-dasharray="4 2"/>
    <line x1="80" y1="160" x2="160" y2="180" stroke="#ff244f" stroke-width="2.5" />
    <line x1="160" y1="180" x2="240" y2="160" stroke="#ff244f" stroke-width="2.5" />
    <line x1="220" y1="90" x2="240" y2="160" stroke="#38ff91" stroke-width="1" stroke-dasharray="4 2"/>
    <line x1="140" y1="60" x2="160" y2="180" stroke="#222d3d" stroke-width="1"/>

    <!-- Nodes -->
    <circle cx="50" cy="80" r="14" fill="#07090b" stroke="#ff244f" stroke-width="2"/>
    <text x="50" y="84" fill="#ffffff" font-family="'Courier New', monospace" font-size="10" text-anchor="middle">S</text>

    <circle cx="140" cy="60" r="14" fill="#07090b" stroke="#38ff91" stroke-width="2"/>
    <text x="140" y="64" fill="#ffffff" font-family="'Courier New', monospace" font-size="10" text-anchor="middle">A</text>

    <circle cx="80" cy="160" r="14" fill="#07090b" stroke="#ff244f" stroke-width="2"/>
    <text x="80" y="164" fill="#ffffff" font-family="'Courier New', monospace" font-size="10" text-anchor="middle">B</text>

    <circle cx="220" cy="90" r="14" fill="#07090b" stroke="#38ff91" stroke-width="2"/>
    <text x="220" y="94" fill="#ffffff" font-family="'Courier New', monospace" font-size="10" text-anchor="middle">C</text>

    <circle cx="160" cy="180" r="14" fill="#07090b" stroke="#ff244f" stroke-width="2"/>
    <text x="160" y="184" fill="#ffffff" font-family="'Courier New', monospace" font-size="10" text-anchor="middle">D</text>

    <circle cx="240" cy="160" r="16" fill="#8c1735" stroke="#ff244f" stroke-width="2"/>
    <text x="240" y="164" fill="#ffffff" font-family="'Courier New', monospace" font-size="10" text-anchor="middle">E*</text>

    <text x="15" y="222" fill="#38ff91" font-family="'Courier New', monospace" font-size="10">OPTIMAL PATH: S → B → D → E [DIST: 42ms]</text>
  </g>

  <!-- Control footer -->
  <g transform="translate(60, 370)">
    <rect x="0" y="0" width="680" height="65" rx="6" fill="#141922" stroke="#222d3d" stroke-width="1"/>
    <rect x="20" y="15" width="80" height="35" rx="4" fill="#ff244f" />
    <text x="60" y="37" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="11" text-anchor="middle">PAUSE</text>
    <rect x="110" y="15" width="80" height="35" rx="4" fill="#1c2533" stroke="#38ff91" stroke-width="1"/>
    <text x="150" y="37" fill="#38ff91" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="11" text-anchor="middle">STEP ▶</text>
    <text x="220" y="37" fill="#a3abb5" font-family="'Courier New', monospace" font-size="11">SPEED: 60 FPS • STEP DELAY: 16ms • MEMORY: 4.2 MB</text>
  </g>
</svg>
