<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="artBg6" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e171b"/>
      <stop offset="60%" stop-color="#080e12"/>
      <stop offset="100%" stop-color="#030608"/>
    </radialGradient>
    <linearGradient id="auroraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff244f"/>
      <stop offset="50%" stop-color="#38ff91"/>
      <stop offset="100%" stop-color="#087a4a"/>
    </linearGradient>
  </defs>

  <rect width="600" height="600" fill="url(#artBg6)"/>

  <!-- Geometric Polygon Sculpture -->
  <g transform="translate(300, 270)">
    <!-- Facets of crystal polyhedra -->
    <polygon points="0,-160 -120,-40 0,30" fill="#111c27" stroke="#38ff91" stroke-width="1.5" opacity="0.9"/>
    <polygon points="0,-160 120,-40 0,30" fill="#172635" stroke="#ff244f" stroke-width="1.8" opacity="0.9"/>
    <polygon points="-120,-40 0,30 -60,140" fill="#0c151f" stroke="#38ff91" stroke-width="1.5" opacity="0.9"/>
    <polygon points="120,-40 0,30 60,140" fill="#13202d" stroke="#ff244f" stroke-width="1.8" opacity="0.9"/>
    <polygon points="0,30 -60,140 0,170 60,140" fill="#080e15" stroke="#38ff91" stroke-width="2"/>
    
    <!-- Outer energy rings -->
    <ellipse cx="0" cy="0" rx="200" ry="80" fill="none" stroke="#ff244f" stroke-width="1.8" stroke-dasharray="10 6" transform="rotate(-25)"/>
    <ellipse cx="0" cy="0" rx="220" ry="90" fill="none" stroke="#38ff91" stroke-width="1.2" stroke-dasharray="6 8" transform="rotate(25)"/>

    <!-- Light points -->
    <circle cx="0" cy="-160" r="5" fill="#38ff91"/>
    <circle cx="-120" cy="-40" r="4" fill="#ff244f"/>
    <circle cx="120" cy="-40" r="4" fill="#38ff91"/>
    <circle cx="0" cy="30" r="6" fill="#ff244f"/>
    <circle cx="0" cy="170" r="5" fill="#38ff91"/>
  </g>

  <text x="30" y="560" fill="#38ff91" font-family="'Courier New', monospace" font-size="12" letter-spacing="2">ARTWORK № 06 // AURORA PROTOCOL</text>
  <text x="30" y="580" fill="#a3abb5" font-family="'Courier New', monospace" font-size="10">PARAMETRIC CRYSTAL • HARMONIC WAVE MATRIX</text>
</svg>
